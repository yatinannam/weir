# Weir alert rules (Phase 4 addendum §5). Thresholds come from measured Phase 1-3 runs. Every rate rule has a
# minimum-traffic guard, so an idle machine never alerts. Shown in Grafana and on Prometheus /alerts only (D42).
groups:
  - name: weir
    rules:
      - alert: WeirDown
        expr: up{job="weir"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Weir is down: Prometheus cannot scrape weir:8000/metrics"}

      - alert: HighErrorRate   # every measured run had 0 errors
        expr: |
          sum(increase(weir_requests_total{status!="ok"}[10m])) / sum(increase(weir_requests_total[10m])) > 0.05
          and sum(increase(weir_requests_total[10m])) >= 10
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 5% of Weir requests are failing"}

      - alert: HighLatencyP95   # normal p95 is 1.1-3.5 s; the 2026-10-05 Groq slowdown reached 7.2 s
        # Non-hit requests only (D47): fast cache hits would otherwise hide a slow model on cache-heavy traffic.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(weir_request_latency_seconds_bucket{cache_status!="hit"}[10m]))) > 4
          and sum(increase(weir_requests_total{cache_status!="hit"}[10m])) >= 10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Weir p95 latency is above 4 s"}

      - alert: ModelFallbacks   # would have caught both 2026-10-05 incidents
        expr: sum(increase(weir_fallbacks_total[5m])) > 0
        labels: {severity: warning}
        annotations: {summary: "A model tier is failing and Weir is falling back to the other tier"}

      - alert: HighEscalationRate   # live rate is 0%
        expr: |
          sum(increase(weir_escalations_total[30m])) / sum(increase(weir_requests_total{route="small"}[30m])) > 0.20
          and sum(increase(weir_requests_total{route="small"}[30m])) >= 10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "More than 20% of small-model answers are being escalated"}

      - alert: CacheHitRateDrop   # usually a kb_version change or an embedding fault
        # D47: "or vector(0)" keeps the rule alive when the hit series disappears; bypassed requests can't hit, so
        # only hit + miss count (switching the cache off is not a hit-rate drop).
        expr: |
          ((sum(increase(weir_requests_total{cache_status="hit"}[15m])) or vector(0))
              / sum(increase(weir_requests_total{cache_status=~"hit|miss"}[15m])))
            < 0.5 * (sum(increase(weir_requests_total{cache_status="hit"}[6h]))
                     / sum(increase(weir_requests_total{cache_status=~"hit|miss"}[6h])))
          and sum(increase(weir_requests_total{cache_status=~"hit|miss"}[15m])) >= 20
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Cache hit rate fell below half its 6-hour average"}

      - alert: CostAboveBaseline   # D47: compared with the counterfactual (no cache, always large), not a fixed $
        # A fixed threshold equal to the baseline's own cost fired on baseline runs by noise. The counterfactual is
        # what the same traffic would cost on the always-large baseline, so this is quiet under `baseline` and fires
        # when Weir costs more than not using it (e.g. heavy escalation).
        expr: |
          sum(increase(weir_cost_usd_total[1h])) > 1.05 * sum(increase(weir_counterfactual_cost_usd_total[1h]))
          and sum(increase(weir_requests_total[1h])) >= 20
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Cost per request is above the always-large baseline"}

      - alert: BackgroundWorkLost   # backlog M7: these losses used to be silent
        # One sum per counter: increase() drops the metric name, so a {__name__=~...} selector over these four
        # same-labelled counters is rejected by the server ("vector cannot contain metrics with the same labelset").
        expr: |
          (sum(increase(weir_log_rows_dropped_total[10m])) or vector(0))
            + (sum(increase(weir_log_rows_failed_total[10m])) or vector(0))
            + (sum(increase(weir_cache_jobs_dropped_total[10m])) or vector(0))
            + (sum(increase(weir_cache_jobs_failed_total[10m])) or vector(0))
          > 0
        labels: {severity: warning}
        annotations: {summary: "Weir dropped or failed background work (log rows or cache jobs)"}
