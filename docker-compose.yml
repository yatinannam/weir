name: weir

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: weir
      POSTGRES_PASSWORD: weir
      POSTGRES_DB: weir
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]  # localhost only: dev password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weir -d weir"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: services/weir/Dockerfile }
    command: ["python", "-m", "weir.migrate"]
    environment:
      DATABASE_URL: postgresql://weir:weir@postgres:5432/weir
    depends_on:
      postgres: { condition: service_healthy }

  hospital-rag:
    build: { context: ., dockerfile: services/hospital-rag/Dockerfile }
    environment:
      DATABASE_URL: postgresql://weir:weir@postgres:5432/weir
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODE: ${LLM_MODE:-groq}
      STUB_TIMING: ${STUB_TIMING:-realistic}   # used only when LLM_MODE=stub (Phase 5, D49)
    volumes: ["./kb:/app/kb:ro"]
    ports: ["127.0.0.1:8001:8001"]  # localhost only: hospital-rag has no auth, Weir does
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  weir:
    build: { context: ., dockerfile: services/weir/Dockerfile }
    environment:
      DATABASE_URL: postgresql://weir:weir@postgres:5432/weir
      WEIR_KEY_PUBLIC: ${WEIR_KEY_PUBLIC:?set WEIR_KEY_PUBLIC in .env}
      WEIR_KEY_STAFF: ${WEIR_KEY_STAFF:?set WEIR_KEY_STAFF in .env}
      WEIR_KEY_ADMIN: ${WEIR_KEY_ADMIN:?set WEIR_KEY_ADMIN in .env}
      WEIR_ABLATION: ${WEIR_ABLATION:-}
    volumes: ["./configs:/app/configs:ro"]
    ports: ["127.0.0.1:8000:8000"]  # localhost only: /metrics has no auth
    depends_on:
      migrate: { condition: service_completed_successfully }
      hospital-rag: { condition: service_healthy }

  # Phase 4 monitoring: opt-in with `docker compose --profile monitoring up -d`.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]  # localhost only
    depends_on: [weir]

  grafana:
    image: grafana/grafana-oss:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]  # localhost only
    depends_on: [prometheus, postgres]

  # Phase 5 load tests: opt-in with `--profile loadtest`; failure runs add -f docker-compose.loadtest.yml.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: ["loadtest"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./loadtest/toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["127.0.0.1:8474:8474"]  # control API, localhost only; the 5433 proxy stays on the Docker network
    depends_on: [postgres]

volumes:
  pgdata:
  promdata:
  grafanadata:
